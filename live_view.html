<!DOCTYPE html>
<html>
<head>
<title>Live Chart Viewer</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
  #status { color: #aaa; padding: 8px; font-size: 14px; }
  img { max-width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div id="status">Live chart — refreshing every 5 seconds. Last updated: <span id="time">-</span></div>
<img id="chart" src="live_ETHUSD.png" alt="Live chart">

<script>
  // Change this to match whichever symbol's chart you want to watch,
  // e.g. "live_BTCUSD.png" or "live_ETHUSD.png"
  const FILENAME = "live_ETHUSD.png";

  function refreshImage() {
    const img = document.getElementById("chart");
    // cache-busting query param forces the browser to actually re-fetch
    // the file from disk instead of showing a cached copy
    img.src = FILENAME + "?t=" + new Date().getTime();
    document.getElementById("time").textContent = new Date().toLocaleTimeString();
  }

  refreshImage();
  setInterval(refreshImage, 5000); // every 5 seconds
</script>
</body>
</html>
